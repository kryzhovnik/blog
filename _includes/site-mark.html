{%- comment -%}
  Inline SVG instead of the ✳ and ← characters: iOS renders ✳ as a color emoji
  and draws ← with a different font. currentColor keeps the theme accent.
  Both shapes are the same eight rays; CSS places them by data-site-mark on <html>.
{%- endcomment -%}
<svg class="site-mark" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-linecap="round"><line x2="8.5"/><line x2="8.5"/><line x2="8.5"/><line x2="8.5"/><line x2="8.5"/><line x2="8.5"/><line x2="8.5"/><line x2="8.5"/></svg>
