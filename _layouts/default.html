<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="48x48">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision }}">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="461a89b6-9cc6-422e-af45-2eb81760f16b"></script>
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% if page.layout == "post" %}
  {% assign md_url = page.url | replace: "/", "" | prepend: "/" | append: ".md" %}
  <link rel="alternate" type="text/markdown" href="{{ md_url | relative_url }}">
  {% endif %}
</head>

<body>
  <header class="site-header">
    <nav>
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/about' | relative_url }}">About</a>
        <div class="theme-switcher" role="group" aria-label="Theme" hidden>
          <button type="button" data-theme-choice="system" aria-label="System theme" title="System theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="13" rx="2"/><path d="M8 20h8M12 17v3"/></svg>
          </button>
          <button type="button" data-theme-choice="light" aria-label="Light theme" title="Light theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"/></svg>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>{{ 'now' | date: "%Y" }} {{ site.author }}</p>
  </footer>
  <script src="{{ '/assets/js/collapsible.js' | relative_url }}"></script>
</body>

</html>
